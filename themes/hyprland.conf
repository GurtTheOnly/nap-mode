# Nap Time hyprland — green/red nap console border mix
$inactiveBorderColor = rgba(2f4535aa)

general {
    col.active_border = rgba(3fae63ff) rgba(d13b3bff) 45deg
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = rgba(3fae63ff) rgba(d13b3bff) 45deg
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = rgba(3fae63ff) rgba(d13b3bff) 45deg
    col.border_locked_inactive = $inactiveBorderColor
}
